[project]
name = "cookbook"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "google-genai>=1.0", "python-dotenv>=1.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]
claude = ["anthropic>=0.60"]  # only needed when a reader uses Claude

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
