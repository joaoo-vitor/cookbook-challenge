<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookbook Challenge</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <svg class="deco" viewBox="0 0 48 40" aria-hidden="true">
        <!-- a pot with steam -->
        <path d="M14 8c-3 3 3 5 0 8M22 6c-3 3 3 5 0 8M30 8c-3 3 3 5 0 8" class="steam"/>
        <rect x="8" y="20" width="32" height="16" rx="4" class="pot"/>
        <rect x="4" y="22" width="5" height="4" rx="2" class="pot"/><rect x="39" y="22" width="5" height="4" rx="2" class="pot"/>
        <rect x="6" y="18" width="36" height="4" rx="2" class="lid"/>
      </svg>
      <h1>Cookbook Challenge</h1>
      <span class="spacer"></span>
      <svg class="deco small" viewBox="0 0 40 40" aria-hidden="true">
        <!-- a tomato -->
        <circle cx="20" cy="23" r="13" class="tomato"/>
        <path d="M20 10c-2 3-6 3-8 2 3 0 4-2 4-4 2 2 4 2 4 2s2 0 4-2c0 2 1 4 4 4-2 1-6 1-8-2z" class="leaf"/>
      </svg>
      <svg class="deco small" viewBox="0 0 40 40" aria-hidden="true">
        <!-- a leaf -->
        <path d="M8 32C6 16 16 6 34 6c0 18-10 28-24 26z" class="leaf"/>
        <path d="M8 32C16 22 22 16 30 10" class="vein"/>
      </svg>
      <svg class="deco small" viewBox="0 0 40 40" aria-hidden="true">
        <!-- a fork -->
        <path d="M12 4v10a4 4 0 0 0 4 4v18M20 4v14M28 4v10a4 4 0 0 1-4 4" class="fork"/>
      </svg>
    </div>
  </header>

  <main id="main"></main>
  <div id="popover" class="popover" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
